---
- name: Ответы debconf для iptables-persistent (без интерактива)
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "{{ item }}"
    value: "false"
    vtype: boolean
  loop:
    - iptables-persistent/autosave_v4
    - iptables-persistent/autosave_v6

- name: Установка пакетов
  ansible.builtin.apt:
    name: [iptables, iptables-persistent, netfilter-persistent, conntrack, traceroute, tcpdump, curl]
    update_cache: true
    cache_valid_time: 3600

- name: net.ipv4.ip_forward
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-ip-forward.conf
    content: "net.ipv4.ip_forward = {{ '1' if ip_forward | bool else '0' }}\n"
    mode: "0644"
  notify: apply sysctl

- name: Отключить сетевую конфигурацию cloud-init
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: "network: {config: disabled}\n"
    mode: "0644"

- name: Удалить 50-cloud-init.yaml (enp0s3 = altname eth0, включал DHCP со шлюзом)
  ansible.builtin.file:
    path: /etc/netplan/50-cloud-init.yaml
    state: absent
  notify: netplan apply

- name: Netplan — адреса и маршруты
  ansible.builtin.template:
    src: 50-otus.yaml.j2
    dest: /etc/netplan/50-otus.yaml
    mode: "0600"
  notify: netplan apply

- name: Права 600 на файлы netplan (убрать предупреждения)
  ansible.builtin.shell: chmod 600 /etc/netplan/*.yaml
  changed_when: false

- name: Применить изменения сразу
  ansible.builtin.meta: flush_handlers

- name: Удалить default через eth0, оставшийся от DHCP (default только через inetRouter)
  ansible.builtin.shell: ip route del default via 10.0.2.2 dev eth0
  register: del_default
  changed_when: del_default.rc == 0
  failed_when: false
  when: not eth0_default_route | bool
